<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyLoo — Legal</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --bg: #FAFAFE;
      --surface: #ffffff;
      --text: #0F172A;
      --text-secondary: #475569;
      --text-tertiary: #94A3B8;
      --accent: #6366F1;
      --accent-dark: #4338CA;
      --accent-deep: #312E81;
      --border: #E2E8F0;
      --serif: 'Instrument Serif', 'Times New Roman', serif;
      --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0f;
        --surface: rgba(255,255,255,0.04);
        --text: #F1F5F9;
        --text-secondary: #94A3B8;
        --text-tertiary: #64748B;
        --border: rgba(255,255,255,0.08);
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 24px; line-height: 1.5; }
    .container { max-width: 480px; width: 100%; text-align: center; }
    .mascot-wrap { width: 320px; height: 220px; max-width: 100%; margin: -8px auto 0; position: relative; display: flex; align-items: center; justify-content: center; }
    .mascot-glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 58%; height: 78%; border-radius: 50%; background: radial-gradient(ellipse, rgba(99,102,241,0.75) 0%, rgba(99,102,241,0.3) 45%, rgba(99,102,241,0) 75%); filter: blur(14px); }
    .mascot { position: relative; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 20px 28px rgba(67,56,202,0.42)) drop-shadow(0 4px 6px rgba(15,23,42,0.14)); animation: float 4.5s ease-in-out infinite; }
    @media (prefers-color-scheme: dark) {
      .mascot-glow { background: radial-gradient(ellipse, rgba(129,140,248,0.85) 0%, rgba(99,102,241,0.35) 45%, rgba(99,102,241,0) 75%); }
    }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
    h1 { font-family: var(--serif); font-size: 56px; font-weight: 400; line-height: 1; letter-spacing: -1.5px; color: var(--text); margin-bottom: 8px; padding-top: 4px; }
    h1 .accent { font-style: italic; color: var(--accent); }
    .subtitle { font-family: var(--sans); font-size: 15px; color: var(--text-secondary); margin-bottom: 32px; }
    .links { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
    a.btn { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); color: var(--text); text-decoration: none; font-family: var(--sans); font-weight: 500; font-size: 15px; transition: all 0.2s ease; }
    a.btn:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(99,102,241,0.12); }
    a.btn .arrow { font-family: var(--mono); color: var(--text-tertiary); font-size: 14px; }
    a.btn:hover .arrow { color: var(--accent); }
    footer { margin-top: 48px; font-family: var(--mono); font-size: 11px; color: var(--text-tertiary); letter-spacing: 0.5px; }
    footer a { color: var(--text-secondary); text-decoration: none; }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <div class="mascot-wrap">
      <div class="mascot-glow"></div>
      <img class="mascot" src="mascots/welcome.png" alt="" aria-hidden="true">
    </div>
    <div class="eyebrow">MyLoo · Legal</div>
    <h1>Real <span class="accent">privacy.</span></h1>
    <p class="subtitle">No fine print, no surprises.</p>
    <div class="links">
      <a class="btn" href="privacy-policy.html">Privacy Policy <span class="arrow">→</span></a>
      <a class="btn" href="terms-of-service.html">Terms of Service <span class="arrow">→</span></a>
    </div>
    <footer>
      <p>&copy; 2026 MyLoo · <a href="mailto:support@myloo.app">support@myloo.app</a></p>
    </footer>
  </div>
</body>
</html>
